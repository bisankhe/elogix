# ============================================================
#  eLogix HRMS — Nginx Configuration
#  Domain: elogix.com.np (NpccTLD)
#  Datahub Nepal VPS · Ubuntu 24.04 LTS
#  Subdomains: www · api · admin · {tenant}
#  SSL: Let's Encrypt (certbot --nginx -d *.elogix.com.np)
# ============================================================

# ── Redirect HTTP → HTTPS ─────────────────────────────────────
server {
    listen 80;
    server_name elogix.com.np www.elogix.com.np *.elogix.com.np;
    return 301 https://$host$request_uri;
}

# ── www.elogix.com.np — React Frontend ───────────────────────
server {
    listen 443 ssl;
    server_name elogix.com.np www.elogix.com.np;
    ssl_certificate     /etc/letsencrypt/live/elogix.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elogix.com.np/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/elogix/dist;
    index index.html;

    # React SPA — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
}

# ── api.elogix.com.np — Flask Backend ────────────────────────
server {
    listen 443 ssl;
    server_name api.elogix.com.np;
    ssl_certificate     /etc/letsencrypt/live/elogix.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elogix.com.np/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
}

# ── admin.elogix.com.np — eLogix SuperAdmin Panel ────────────
server {
    listen 443 ssl;
    server_name admin.elogix.com.np;
    ssl_certificate     /etc/letsencrypt/live/elogix.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elogix.com.np/privkey.pem;

    root /var/www/elogix/dist;
    index index.html;

    # Serve the same React build — AdminPage loads from /elogix-admin route
    location / {
        try_files $uri /index.html;
        # Extra IP whitelist for admin panel (optional but recommended)
        # allow 202.xxx.xxx.xxx;  # Office IP
        # deny all;
    }
    add_header X-Frame-Options "DENY";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
}

# ── {tenant}.elogix.com.np — Tenant Company Portals ──────────
server {
    listen 443 ssl;
    server_name *.elogix.com.np;
    ssl_certificate     /etc/letsencrypt/live/elogix.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elogix.com.np/privkey.pem;

    root /var/www/elogix/dist;
    index index.html;

    # All tenant subdomains serve same React build
    # React reads subdomain → resolves tenant → shows company portal
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
}
