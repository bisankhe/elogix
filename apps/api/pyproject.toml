[project]
name = "elogix-api"
version = "0.1.0"
description = "eLogix HRMS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "pwdlib[argon2,bcrypt]>=0.2",
    "nepali-datetime>=1.0.8",
    "pydantic[email]>=2.13.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elogix_api"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# Alembic writes these; reformatting machine output by hand is pure churn, and the
# template already keeps them consistent.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers -q"
testpaths = ["tests"]
