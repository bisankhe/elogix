# FILE: nginx.conf  (root of project)
# eLogix HRMS — Production Nginx Configuration
# TLS is terminated at the external load balancer (Vertizzo/Yeticloud);
# this container only ever speaks plain HTTP on port 80.
#
# Fixes:
#   1. Images / static assets not loading  →  /assets/ served directly from dist/
#   2. Logo.png 404                         →  explicit image location block
#   3. API routing to Flask backend         →  /api/ proxied to gunicorn on elogix_backend:5000
#   4. SPA client-side routing               →  all non-asset routes return index.html
#   5. Upload file size                      →  50MB limit for CV/document uploads
#   6. Gzip compression                      →  JS/CSS/JSON compressed
#   7. Security headers                      →  X-Frame-Options, etc. (HSTS added at LB)
# eLogix Technologies

# ── Rate limiting zones ───────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

# ── Gzip ─────────────────────────────────────────────────────────────
gzip                on;
gzip_types          text/plain text/css application/json application/javascript
                     text/javascript application/x-javascript image/svg+xml
                     application/xml+rss font/woff font/woff2;
gzip_comp_level     6;
gzip_min_length     1000;
gzip_vary           on;
gzip_proxied        any;

# ── Upstream Flask backend ────────────────────────────────────────────
upstream elogix_backend {
    server elogix_backend:5000;
    keepalive 64;
}

# ── Main HTTP server (TLS terminated upstream at the load balancer) ──
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ── Paths ─────────────────────────────────────────────────────────
    root        /usr/share/nginx/html;
    index       index.html;

    # ── Request limits ────────────────────────────────────────────────
    client_max_body_size    50M;
    client_body_timeout     60s;
    client_header_timeout   60s;
    keepalive_timeout       65s;
    send_timeout            60s;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

    # ── STATIC ASSETS ──────────────────────────────────────────────
    # Vite builds assets with content-hash filenames: Logo-CyteoIDf.png
    location /assets/ {
        root        /usr/share/nginx/html;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        add_header  Access-Control-Allow-Origin "*";
        access_log  off;
        try_files $uri =404;
    }

    # ── Favicon ───────────────────────────────────────────────────────
    location = /favicon.ico {
        root        /usr/share/nginx/html;
        expires     7d;
        access_log  off;
        try_files   $uri =204;
    }

    # ── Logo and other root-level images ──────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        root        /usr/share/nginx/html;
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
        try_files   $uri =404;
    }

    # ── Fonts ─────────────────────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot)$ {
        root        /usr/share/nginx/html;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        add_header  Access-Control-Allow-Origin "*";
        access_log  off;
        try_files   $uri =404;
    }

    # ── Tenant upload files (CVs, photos, documents) ──────────────────
    location /uploads/ {
        internal;
        alias /var/www/elogix/uploads/;
        expires 1h;
        add_header Cache-Control "private";
    }

    # ── API — proxied to Flask/Gunicorn ──────────────────────────────
    location /api/ {
        limit_req           zone=api_limit burst=50 nodelay;
        proxy_pass          http://elogix_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";
        proxy_cache_bypass  $http_upgrade;
        proxy_connect_timeout   60s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        proxy_buffer_size       16k;
        proxy_buffers            4 32k;
    }

    # ── Auth endpoints — stricter rate limiting ────────────────────────
    location /api/v1/auth/ {
        limit_req   zone=auth_limit burst=10 nodelay;
        proxy_pass          http://elogix_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── File upload endpoints ─────────────────────────────────────────
    location ~ ^/api/v1/(employees|applicants|documents)/.*upload {
        limit_req               zone=upload_limit burst=5 nodelay;
        client_max_body_size    50M;
        proxy_pass               http://elogix_backend;
        proxy_http_version       1.1;
        proxy_set_header         Host              $host;
        proxy_set_header         X-Real-IP         $remote_addr;
        proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header         X-Forwarded-Proto $scheme;
        proxy_request_buffering  off;
        proxy_read_timeout       300s;
    }

    # ── Health check ─────────────────────────────────────────────────
    location = /api/health {
        proxy_pass http://elogix_backend;
        access_log off;
    }

    # ── WebSocket (AI chatbot, real-time notifications) ──────────────
    location /ws/ {
        proxy_pass              http://elogix_backend;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }

    # ── React SPA — ALL other routes return index.html ───────────────
    # Must come AFTER /assets/, /api/, /uploads/ locations.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires    0;
    }

    # ── Error pages ───────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Logging ───────────────────────────────────────────────────────
    access_log  /var/log/nginx/elogix_access.log combined buffer=64k flush=5m;
    error_log   /var/log/nginx/elogix_error.log warn;
}

# ── Monitoring (internal only) ────────────────────────────────────────
server {
    listen      8080;
    server_name 127.0.0.1;

    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        deny  all;
    }
}
