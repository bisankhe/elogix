# FILE: nginx.conf  (root of project — also copy to /etc/nginx/sites-available/elogix)
# eLogix HRMS — Production Nginx Configuration
# Fixes:
#   1. Images / static assets not loading  →  /assets/ served directly from dist/
#   2. Logo.png 404                         →  explicit /assets/Logo*.png location
#   3. API routing to Flask backend         →  /api/ proxied to gunicorn on 127.0.0.1:5000
#   4. SPA client-side routing              →  all non-asset routes return index.html
#   5. HTTPS redirect                       →  HTTP → HTTPS always
#   6. Upload file size                     →  50MB limit for CV/document uploads
#   7. Gzip compression                     →  JS/CSS/JSON compressed
#   8. Security headers                     →  HSTS, X-Frame-Options, etc.
# eLogix Technologies · www.elogix.com.np

# ── Rate limiting zones ───────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

# ── Gzip ─────────────────────────────────────────────────────────────
gzip                on;
gzip_types          text/plain text/css application/json application/javascript
                    text/javascript application/x-javascript image/svg+xml
                    application/xml+rss font/woff font/woff2;
gzip_comp_level     6;
gzip_min_length     1000;
gzip_vary           on;
gzip_proxied        any;

# ── Upstream Flask backend ────────────────────────────────────────────
upstream elogix_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name elogix.com.np www.elogix.com.np;

    # Let's Encrypt challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name elogix.com.np www.elogix.com.np;

    # ── SSL certificates (Certbot / Let's Encrypt) ────────────────────
    ssl_certificate         /etc/letsencrypt/live/elogix.com.np/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/elogix.com.np/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/elogix.com.np/chain.pem;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     10m;
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                8.8.8.8 8.8.4.4 valid=300s;

    # ── Paths ─────────────────────────────────────────────────────────
    root        /var/www/elogix/dist;
    index       index.html;

    # ── Request limits ────────────────────────────────────────────────
    client_max_body_size    50M;
    client_body_timeout     60s;
    client_header_timeout   60s;
    keepalive_timeout       65s;
    send_timeout            60s;

    # ── Security headers ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.anthropic.com wss:; frame-src 'none';" always;

    # ── STATIC ASSETS — THIS IS THE FIX FOR IMAGES NOT LOADING ──────
    # Vite builds assets with content-hash filenames: Logo-CyteoIDf.png
    # These MUST be served directly from dist/assets/ with long cache TTL.
    # Without this, nginx tries to serve them via Flask (SPA fallback)
    # which Flask can't find → 404.

    location /assets/ {
        root        /var/www/elogix/dist;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        add_header  Access-Control-Allow-Origin "*";
        access_log  off;

        # Ensure images are served with correct MIME types
        types {
            image/png           png;
            image/jpeg          jpg jpeg;
            image/svg+xml       svg;
            image/webp          webp;
            image/x-icon        ico;
            image/gif           gif;
            application/javascript  js;
            text/css            css;
            font/woff           woff;
            font/woff2          woff2;
            application/json    json;
        }

        # Return 404 for missing assets (don't fall through to SPA)
        try_files $uri =404;
    }

    # ── Favicon ───────────────────────────────────────────────────────
    location = /favicon.ico {
        root        /var/www/elogix/dist;
        expires     7d;
        access_log  off;
        try_files   $uri =204;               # Return 204 if not found (no error)
    }

    # ── Logo and other root-level images ──────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        root        /var/www/elogix/dist;
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
        try_files   $uri =404;
    }

    # ── Fonts ─────────────────────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot)$ {
        root        /var/www/elogix/dist;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        add_header  Access-Control-Allow-Origin "*";
        access_log  off;
        try_files   $uri =404;
    }

    # ── Tenant upload files (CVs, photos, documents) ──────────────────
    # Stored at /var/www/elogix/uploads/{tenant_slug}/
    location /uploads/ {
        internal;                             # Only accessible via X-Accel-Redirect from Flask
        alias /var/www/elogix/uploads/;
        expires 1h;
        add_header Cache-Control "private";
    }

    # ── API — proxied to Flask/Gunicorn ──────────────────────────────
    location /api/ {
        limit_req       zone=api_limit burst=50 nodelay;

        proxy_pass          http://elogix_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";
        proxy_cache_bypass  $http_upgrade;

        proxy_connect_timeout   60s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        proxy_buffer_size       16k;
        proxy_buffers           4 32k;

        # CORS handled by Flask; nginx just passes through
    }

    # ── Auth endpoints — stricter rate limiting ────────────────────────
    location /api/v1/auth/ {
        limit_req   zone=auth_limit burst=10 nodelay;

        proxy_pass          http://elogix_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── File upload endpoints ─────────────────────────────────────────
    location ~ ^/api/v1/(employees|applicants|documents)/.*upload {
        limit_req               zone=upload_limit burst=5 nodelay;
        client_max_body_size    50M;

        proxy_pass              http://elogix_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_request_buffering off;           # Stream uploads directly to Flask
        proxy_read_timeout      300s;
    }

    # ── Health check ─────────────────────────────────────────────────
    location = /api/health {
        proxy_pass http://elogix_backend;
        access_log off;
    }

    # ── WebSocket (AI chatbot, real-time notifications) ──────────────
    location /ws/ {
        proxy_pass              http://elogix_backend;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }

    # ── React SPA — ALL other routes return index.html ───────────────
    # This MUST come AFTER all /assets/, /api/, /uploads/ locations.
    # DO NOT add try_files here that would serve files from root
    # because that would match /assets/ requests and break caching.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires    0;
    }

    # ── Error pages ───────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/elogix/dist;
        internal;
    }

    # ── Logging ───────────────────────────────────────────────────────
    access_log  /var/log/nginx/elogix_access.log combined buffer=64k flush=5m;
    error_log   /var/log/nginx/elogix_error.log warn;
}

# ── Monitoring (internal only) ────────────────────────────────────────
server {
    listen      8080;
    server_name 127.0.0.1;

    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        deny  all;
    }
}
