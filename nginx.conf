# FILE: nginx.conf
# eLogix HRMS — Nginx configuration for VPS (Datahub Yeti Cloud)
# Proxies API to Flask backend, serves React SPA, handles SSL
# eLogix Technologies · www.elogix.com.np

upstream flask_backend {
    server backend:5000;
    keepalive 32;
}

upstream celery_flower {
    server flower:5555;
}

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=60r/m;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name elogix.com.np www.elogix.com.np elogix.ktm.yetiappcloud.com;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header X-XSS-Protection       "1; mode=block"       always;
    add_header Referrer-Policy        "strict-origin"       always;
    add_header Permissions-Policy     "geolocation=(), microphone=()" always;

    # Max upload size (50MB for bulk CV, documents)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # ── API → Flask backend ───────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass         http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      16 8k;
    }

    # Stricter rate limit for auth endpoints
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://flask_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Celery Flower monitoring (protected) ──────────────────────
    location /flower/ {
        proxy_pass         http://celery_flower/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_redirect     off;
        # Already protected by Flower's --basic-auth
    }

    # ── Static assets (long cache) ────────────────────────────────
    location /assets/ {
        root    /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── React SPA (catch-all) ──────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # No cache for HTML (so app updates deploy instantly)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Health check (no logs) ────────────────────────────────────
    location /api/health {
        proxy_pass http://flask_backend;
        access_log off;
    }
}
