<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eLogix Cache Wiper</title>
<style>
  :root {
    --bg: #f0f9ff; --card: #ffffff; --fg: #0f172a; --sub: #64748b;
    --accent: #0369a1; --accent2: #0ea5e9; --danger: #dc2626;
    --success: #16a34a; --border: #e2e8f0; --warn-bg: #fef9c3; --warn-fg: #854d0e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0f1e; --card: #1e293b; --fg: #f1f5f9; --sub: #94a3b8;
      --accent: #38bdf8; --accent2: #7dd3fc; --border: #334155;
      --warn-bg: #422006; --warn-fg: #fcd34d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0f1e; --card: #1e293b; --fg: #f1f5f9; --sub: #94a3b8;
    --accent: #38bdf8; --accent2: #7dd3fc; --border: #334155;
    --warn-bg: #422006; --warn-fg: #fcd34d; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px max(16px, env(safe-area-inset-left,0px));
    padding-right: max(16px, env(safe-area-inset-right,0px));
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 36px 32px;
    max-width: 500px; width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,.10);
  }
  .logo { font-size: 36px; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 900; color: var(--fg); margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--sub); margin-bottom: 24px; line-height: 1.5; }
  .warn {
    background: var(--warn-bg); color: var(--warn-fg);
    border-radius: 10px; padding: 12px 14px; font-size: 12px;
    font-weight: 600; margin-bottom: 20px; line-height: 1.5;
  }
  .keys {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 20px;
    max-height: 260px; overflow-y: auto;
  }
  .keys h3 { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 8px; }
  .key-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .key-item:last-child { border-bottom: none; }
  .key-name { font-family: monospace; color: var(--accent); }
  .key-status { font-size: 11px; font-weight: 700; }
  .key-status.found { color: var(--danger); }
  .key-status.clean { color: var(--success); }
  .btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 800; cursor: pointer;
    margin-bottom: 10px; transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 4px 14px rgba(3,105,161,.28);
  }
  .btn-secondary {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); font-weight: 600;
  }
  .result {
    margin-top: 16px; padding: 14px; border-radius: 10px;
    font-size: 13px; font-weight: 600; display: none; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
  }
  .result.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
  .result.info    { background: #eff6ff; color: var(--accent); border: 1px solid #bfdbfe; }
  .result.error   { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .result.success { background: #052e16; border-color: #166534; }
    :root:not([data-theme="light"]) .result.info    { background: #0c1a2e; border-color: #1e40af; }
    :root:not([data-theme="light"]) .result.error   { background: #2d0a0a; border-color: #991b1b; }
  }
  .redirect-bar {
    margin-top: 14px; font-size: 12px; color: var(--sub); text-align: center; display: none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">⚡</div>
  <h1>eLogix Cache Wiper</h1>
  <p class="sub">Clears all eLogix browser storage so the admin panel loads fresh data from the API. Scans every <code>elogix_</code> key dynamically — no hardcoded list.</p>

  <div class="warn" id="warnBanner">
    ⚠️ Checking cache… please wait.
  </div>

  <div class="keys" id="keyList">
    <h3>elogix_ localStorage Keys</h3>
    <div id="keyRows">Scanning…</div>
  </div>

  <button class="btn btn-primary" id="btnWipe" onclick="doWipe()">
    🗑️ Wipe All eLogix Cache &amp; Go to App
  </button>
  <button class="btn btn-secondary" onclick="doInspect()">
    🔍 Inspect Only (no wipe)
  </button>

  <div class="result" id="result"></div>
  <div class="redirect-bar" id="redir"></div>
</div>

<script>
  // ── Dynamically collect every key that starts with "elogix_" ──────────
  function getElogixKeys() {
    const keys = []
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i)
        if (k && k.startsWith('elogix_')) keys.push(k)
      }
    } catch(_e) {}
    return keys.sort()
  }

  // Also wipe these auth keys that don't use the elogix_ prefix
  const AUTH_KEYS = ['access_token', 'access_token_expiry', 'refresh_token']

  function readKey(k) {
    try { return { raw: localStorage.getItem(k), err: null } }
    catch(e) { return { raw: null, err: e.message } }
  }

  function scanAll() {
    const elogixKeys = getElogixKeys()
    return elogixKeys.map(k => {
      const { raw, err } = readKey(k)
      if (err)      return { k, status: 'error',   detail: err }
      if (raw === null) return { k, status: 'empty' }
      return { k, status: 'present', size: raw.length }
    })
  }

  function renderKeys(scan) {
    if (scan.length === 0) {
      document.getElementById('keyRows').innerHTML =
        '<div style="color:var(--success);font-size:12px;padding:4px 0">✓ No elogix_ keys found — cache is clean</div>'
      return
    }
    const rows = scan.map(s => {
      let badge, label
      if (s.status === 'empty')   { badge = 'clean'; label = '✓ empty' }
      else if (s.status === 'present') { badge = 'found'; label = `● present (${(s.size/1024).toFixed(1)} KB)` }
      else                             { badge = 'found'; label = '✗ error' }
      return `<div class="key-item">
        <span class="key-name">${s.k}</span>
        <span class="key-status ${badge}">${label}</span>
      </div>`
    }).join('')
    document.getElementById('keyRows').innerHTML = rows
  }

  function updateBanner(scan) {
    const present = scan.filter(s => s.status === 'present')
    const banner  = document.getElementById('warnBanner')
    if (present.length === 0) {
      banner.style.background = '#f0fdf4'
      banner.style.color = '#166534'
      banner.textContent = '✅ No stale cache detected. Your browser is clean.'
    } else {
      banner.textContent = `⚠️ Found ${present.length} elogix_ key(s) with data. Click Wipe to clear them.`
    }
  }

  function init() {
    const scan = scanAll()
    renderKeys(scan)
    updateBanner(scan)
  }

  function doWipe() {
    const btn = document.getElementById('btnWipe')
    btn.disabled = true
    btn.textContent = '⟳ Wiping…'

    let wiped = 0, errors = []

    // Wipe all elogix_ keys
    const elogixKeys = getElogixKeys()
    for (const k of elogixKeys) {
      try { localStorage.removeItem(k); wiped++ }
      catch(e) { errors.push(k) }
    }

    // Wipe auth keys
    for (const k of AUTH_KEYS) {
      try {
        if (localStorage.getItem(k) !== null) { localStorage.removeItem(k); wiped++ }
      } catch(e) { errors.push(k) }
    }

    // Wipe sessionStorage elogix_ keys
    try {
      const ssKeys = []
      for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i)
        if (k && k.startsWith('elogix_')) ssKeys.push(k)
      }
      ssKeys.forEach(k => { try { sessionStorage.removeItem(k) } catch(_) {} })
    } catch(_) {}

    const res = document.getElementById('result')
    res.style.display = 'block'
    if (errors.length === 0) {
      res.className = 'result success'
      res.textContent = `✅ Wiped ${wiped} key(s) successfully. Redirecting to app in 2 seconds…`
    } else {
      res.className = 'result error'
      res.textContent = `Wiped ${wiped} key(s). Could not remove: ${errors.join(', ')}. Try manually in DevTools.`
    }

    const redir = document.getElementById('redir')
    redir.style.display = 'block'
    let countdown = 2
    redir.textContent = `Redirecting in ${countdown}s…`
    const t = setInterval(() => {
      countdown--
      redir.textContent = countdown > 0 ? `Redirecting in ${countdown}s…` : 'Redirecting…'
      if (countdown <= 0) {
        clearInterval(t)
        const target = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
          ? 'http://localhost:5173'
          : location.origin
        window.location.href = target
      }
    }, 1000)

    init() // refresh the key list
  }

  function doInspect() {
    const res = document.getElementById('result')
    res.style.display = 'block'
    res.className = 'result info'
    const elogixKeys = getElogixKeys()
    let lines = [`🔍 Full localStorage scan (${elogixKeys.length} elogix_ keys):\n`]
    for (const k of elogixKeys) {
      const v = localStorage.getItem(k)
      if (v === null) { lines.push(`${k}: (empty)`); continue }
      try {
        const p = JSON.parse(v)
        if (Array.isArray(p))        lines.push(`${k}: Array[${p.length}]`)
        else if (typeof p === 'object') lines.push(`${k}: Object{${Object.keys(p).slice(0,4).join(', ')}}`)
        else                            lines.push(`${k}: "${String(v).slice(0,80)}"`)
      } catch(_) {
        lines.push(`${k}: "${String(v).slice(0,80)}"`)
      }
    }
    if (elogixKeys.length === 0) lines.push('(no elogix_ keys found — cache is clean)')
    res.textContent = lines.join('\n')
  }

  // Run on load
  init()
</script>
</body>
</html>
