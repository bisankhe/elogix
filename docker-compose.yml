# FILE: docker-compose.yml
# eLogix HRMS — VPS Production Docker Compose
# Datahub Yeti Cloud deployment
# Services: nginx + frontend, Flask backend, Celery worker, Celery beat,
#           PostgreSQL, Redis, Flower (Celery monitor)
# eLogix Technologies · www.elogix.com.np

version: '3.9'

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - elogix_net
  restart: unless-stopped

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: elogix_postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-elogix_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-elogix_hrms_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d/schemas:ro
      - ./database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"   # local only — not exposed to internet
    networks:
      - elogix_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elogix_prod} -d ${POSTGRES_DB:-elogix_hrms_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + result backend + cache) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: elogix_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-elogix_redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"   # local only
    networks:
      - elogix_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-elogix_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask Backend (Gunicorn) ────────────────────────────────────────
  backend:
    <<: *backend-common
    container_name: elogix_backend
    command: >
      gunicorn app:app
      --bind 0.0.0.0:5000
      --workers ${GUNICORN_WORKERS:-4}
      --worker-class gthread
      --threads ${GUNICORN_THREADS:-2}
      --worker-tmp-dir /dev/shm
      --timeout 120
      --keepalive 5
      --max-requests 1000
      --max-requests-jitter 100
      --preload
      --access-logfile -
      --error-logfile -
      --log-level info
    ports:
      - "127.0.0.1:5000:5000"   # internal only — nginx proxies
    volumes:
      - media_files:/opt/elogix/media
      - ./backend:/opt/elogix/backend:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Worker (default + high queues) ──────────────────────────
  celery_worker:
    <<: *backend-common
    container_name: elogix_celery_worker
    command: >
      celery -A celery_app.celery worker
      --queues=high,default
      --concurrency=${CELERY_WORKERS:-4}
      --max-tasks-per-child=200
      --loglevel=info
      --hostname=worker@%h
      --without-heartbeat
    volumes:
      - media_files:/opt/elogix/media
      - ./backend:/opt/elogix/backend:ro
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app.celery", "inspect", "ping", "-t", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Worker (reports + AI — separate for isolation) ──────────
  celery_worker_reports:
    <<: *backend-common
    container_name: elogix_celery_reports
    command: >
      celery -A celery_app.celery worker
      --queues=reports,low
      --concurrency=2
      --max-tasks-per-child=50
      --loglevel=info
      --hostname=reports@%h
    volumes:
      - media_files:/opt/elogix/media
      - ./backend:/opt/elogix/backend:ro

  # ── Celery Beat (scheduler) ─────────────────────────────────────────
  celery_beat:
    <<: *backend-common
    container_name: elogix_celery_beat
    command: >
      celery -A celery_app.celery beat
      --loglevel=info
      --scheduler redbeat.RedBeatScheduler
      --max-interval=30
    volumes:
      - celery_beat_data:/tmp/celerybeat
      - ./backend:/opt/elogix/backend:ro
    # Only ONE beat instance — never scale this
    deploy:
      replicas: 1

  # ── Flower (Celery monitoring UI) ───────────────────────────────────
  flower:
    <<: *backend-common
    container_name: elogix_flower
    command: >
      celery -A celery_app.celery flower
      --port=5555
      --broker=${REDIS_URL}
      --basic-auth=${FLOWER_USER:-elogix}:${FLOWER_PASSWORD:-flower_secret}
      --url-prefix=flower
    ports:
      - "127.0.0.1:5555:5555"   # nginx proxies /flower/ to here
    depends_on:
      - redis
      - celery_worker

  # ── Frontend (nginx serving React build) ───────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: elogix_frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - elogix_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  media_files:
  celery_beat_data:

networks:
  elogix_net:
    driver: bridge
