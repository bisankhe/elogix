# ============================================================
# eLogix HRMS — Production Docker Compose
# eLogix Technologies · www.elogix.com.np
# Datahub Nepal VPS · Ubuntu 24.04 LTS
# ============================================================
version: '3.9'

services:

  elogix_db:
    image: postgres:15-alpine
    container_name: elogix_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       elogix_hrms_prod
      POSTGRES_USER:     elogix_prod
      POSTGRES_PASSWORD: Yb5cnpltBSxA9TiGFWTU2NWEORmH
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/migrations/tenant_rls_policies.sql:/docker-entrypoint-initdb.d/01_rls.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elogix_prod -d elogix_hrms_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elogix_net

  elogix_redis:
    image: redis:7-alpine
    container_name: elogix_redis
    restart: unless-stopped
    command: redis-server --requirepass eLogixRedis2083
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "eLogixRedis2083", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - elogix_net

  elogix_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elogix_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://elogix_prod:Yb5cnpltBSxA9TiGFWTU2NWEORmH@elogix_db:5432/elogix_hrms_prod
      REDIS_URL:    redis://:eLogixRedis2083@elogix_redis:6379/0
      FLASK_ENV:    production
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      elogix_db:
        condition: service_healthy
      elogix_redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - elogix_net

networks:
  elogix_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
