version: '3.8'

services:
backend:
    image: ghcr.io/bisankhe/elogix/backend:latest
    restart: always
    command: sh -c "alembic upgrade head && gunicorn --bind 0.0.0.0:5000 app:app"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - elogix-network

  frontend:
    image: ghcr.io/bisankhe/elogix/frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - elogix-network

  database:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elogix_prod}
      POSTGRES_USER: ${POSTGRES_USER:-elogix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elogix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elogix-network

volumes:
  postgres_data:

networks:
  elogix-network:
    driver: bridge
