# Local development dependencies only. The API and web app run on the host.
name: elogix

services:
  db:
    image: postgres:18-alpine
    container_name: elogix_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elogix
      POSTGRES_PASSWORD: elogix
      POSTGRES_DB: elogix
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the mount
      # goes at /var/lib/postgresql — mounting .../data crash-loops on startup.
      - elogix_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elogix -d elogix"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elogix_dev_pgdata:
