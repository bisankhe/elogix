# FILE: alembic.ini  (project root — /opt/elogix/alembic.ini)
# eLogix HRMS — Alembic Migration Configuration
# Run from: /opt/elogix/  (project root, NOT /opt/elogix/backend/)
# Command:  alembic upgrade head
# eLogix Technologies · www.elogix.com.np

[alembic]
# Path to migration scripts folder (relative to THIS file's location)
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration file timestamps
timezone = Asia/Kathmandu

# Max length of migration file slug
truncate_slug_length = 40

# Database URL — overridden by env.py reading from .env
# Format: postgresql://user:password@host:port/database
sqlalchemy.url = postgresql://%(DB_USER)s:%(DB_PASSWORD)s@%(DB_HOST)s:%(DB_PORT)s/%(DB_NAME)s

# ── Logging configuration ─────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level     = WARN
handlers  = console
qualname  =

[logger_sqlalchemy]
level     = WARN
handlers  =
qualname  = sqlalchemy.engine

[logger_alembic]
level     = INFO
handlers  =
qualname  = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format    = %(levelname)-5.5s [%(name)s] %(message)s
datefmt   = %H:%M:%S
