name: eLogix CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elogix/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elogix/frontend

jobs:

  # ============================================================
  # BUILD AND PUSH BACKEND
  # ============================================================
  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # BUILD AND PUSH FRONTEND
  # ============================================================
  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # DEPLOY TO SERVER
  # ============================================================
  deploy:
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    # Deploy only after push to main, not pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ----------------------------------------------------------
      # Check SSH secret
      # ----------------------------------------------------------
      - name: Check SSH private key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty"
            exit 1
          fi

          echo "SSH_PRIVATE_KEY is present"

          FIRST_LINE=$(echo "$SSH_KEY" | head -n 1)
          LAST_LINE=$(echo "$SSH_KEY" | tail -n 1)

          echo "Key starts with: $FIRST_LINE"
          echo "Key ends with: $LAST_LINE"


      # ----------------------------------------------------------
      # Deploy using SSH
      # ----------------------------------------------------------
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          timeout: 60s
          command_timeout: 10m

          script: |
            set -e

            echo "=========================================="
            echo "Connected to deployment server"
            echo "=========================================="

            echo "--- Current user ---"
            whoami

            echo "--- Hostname ---"
            hostname

            echo "--- Docker version ---"
            docker --version

            echo "--- Docker Compose version ---"
            docker compose version

            echo "--- Deployment directory ---"
            cd "${{ secrets.REMOTE_PATH }}"

            pwd

            echo "=========================================="
            echo "Pulling latest Docker images"
            echo "=========================================="

            docker compose pull

            echo "=========================================="
            echo "Starting containers"
            echo "=========================================="

            docker compose up -d --remove-orphans

            echo "=========================================="
            echo "Container status"
            echo "=========================================="

            docker compose ps

            echo "=========================================="
            echo "Waiting for frontend"
            echo "=========================================="

            sleep 10

            if curl -sf http://localhost:80 > /dev/null; then
              echo "Frontend responding successfully"
            else
              echo "ERROR: Frontend is not responding"

              echo "--- Frontend logs ---"
              docker compose logs --tail 30 frontend

              exit 1
            fi

            echo "=========================================="
            echo "Waiting for backend"
            echo "=========================================="

            sleep 5

            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Backend responding successfully"
            else
              echo "ERROR: Backend is not responding"

              echo "--- Backend logs ---"
              docker compose logs --tail 50 backend

              exit 1
            fi

            echo "=========================================="
            echo "Deployment completed successfully"
            echo "=========================================="
