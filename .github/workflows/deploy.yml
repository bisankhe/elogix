# eLogix Technologies · www.elogix.com.np · Datahub Nepal VPS
name: Deploy eLogix HRMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ══════════════════════════════════════════════════════════════
  # 1. TEST BACKEND
  # ══════════════════════════════════════════════════════════════
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       elogix_test
          POSTGRES_USER:     elogix
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          DATABASE_URL:   postgresql://elogix:testpass@localhost:5432/elogix_test
          FLASK_ENV:      testing
          PYTHONPATH:     .
          SECRET_KEY:     ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret

  # ══════════════════════════════════════════════════════════════
  # 2. BUILD FRONTEND
  # ══════════════════════════════════════════════════════════════
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_API_URL: https://api.elogix.com.np

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

