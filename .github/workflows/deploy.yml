# FILE: .github/workflows/deploy.yml
# eLogix HRMS — CI/CD Pipeline
# eLogix Technologies · www.elogix.com.np · Datahub Nepal VPS
name: Deploy eLogix HRMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ══════════════════════════════════════════════════════════════
  # 1. TEST BACKEND
  # ══════════════════════════════════════════════════════════════
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: elogix_test
          POSTGRES_USER: elogix
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-flask faker anyio

      - name: Run backend tests
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://elogix:testpass@localhost:5432/elogix_test
          FLASK_ENV: testing
          PYTHONPATH: .
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret

  # ══════════════════════════════════════════════════════════════
  # 2. BUILD FRONTEND ASSETS
  # ══════════════════════════════════════════════════════════════
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # 3. BUILD BACKEND DOCKER IMAGE
  # ══════════════════════════════════════════════════════════════
  build-backend-image:
    needs: [test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/elogix-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════
  # 4. DEPLOY TO DATAHUB NEPAL VPS
  # ══════════════════════════════════════════════════════════════
  deploy:
    needs: [build-frontend, build-backend-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Copy files to VPS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          source: "dist/"
          target: "/tmp/elogix-dist/"
          timeout: "60s"
          command_timeout: "5m"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          timeout: "60s"
          command_timeout: "20m"
          script: |
            set -e
            echo "🚀 eLogix deploy started at $(date)"

            cd ~/elogix
            git fetch origin main
            git reset --hard origin/main

            # Sync React build to system path and docker volume
            mkdir -p ~/elogix/dist
            cp -r /tmp/elogix-dist/dist/* ~/elogix/dist/ || cp -r /tmp/elogix-dist/* ~/elogix/dist/
            sudo mkdir -p /var/www/elogix/dist
            sudo cp -r /tmp/elogix-dist/dist/* /var/www/elogix/dist/ || sudo cp -r /tmp/elogix-dist/* /var/www/elogix/dist/
            sudo chmod -R 755 /var/www/elogix/dist
            rm -rf /tmp/elogix-dist

            # Authenticate Docker & pull latest backend image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f

            # Reload Nginx
            sudo nginx -t && sudo systemctl reload nginx || true
            echo "✅ eLogix deploy completed at $(date)"
            echo "  Live: https://www.elogix.com.np"

      - name: Deploy summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  eLogix HRMS — ${{ github.sha }}"
          echo "  Tests: ✅ PASSED  |  Full Deploy: ✅ PASSED"
          echo "  Live:  https://www.elogix.com.np"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
