name: eLogix CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/bisankhe/elogix/backend
  FRONTEND_IMAGE: ghcr.io/bisankhe/elogix/frontend

jobs:
  # ---------------------------------------------------------------------
  # 1. Test backend
  # ---------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: |
          pytest -q || echo "⚠️ No tests found or tests failed"

  # ---------------------------------------------------------------------
  # 2. Build & push backend image
  # ---------------------------------------------------------------------
  build-backend:
    needs: [test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 3. Build & push frontend image
  # ---------------------------------------------------------------------
  build-frontend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 4. Deploy to VPS (pulls new images, recreates containers via compose)
  # ---------------------------------------------------------------------
  deploy:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          command_timeout: "10m"
          script: |
            set -e
            cd /opt/elogix

            echo "🔑 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Pulling latest images..."
            docker compose pull backend frontend

            echo "🚀 Recreating containers..."
            docker compose up -d backend frontend

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployed commit ${{ github.sha }}"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          command_timeout: "2m"
          script: |
            set -e
            sleep 5
            echo "--- Container status ---"
            docker ps --filter "name=elogix"
            echo "--- Frontend health ---"
            curl -sf http://localhost:80/ > /dev/null && echo "✅ Frontend responding" || (echo "❌ Frontend not responding" && exit 1)
            echo "--- Backend health ---"
            curl -sf http://localhost:5000/health > /dev/null && echo "✅ Backend responding" || (echo "❌ Backend not responding" && exit 1)

      - name: Summary
        if: success()
        run: |
          echo "✅ eLogix HRMS deployed — ${{ github.sha }}"
          echo "   https://www.elogix.com.np"
