name: eLogix CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elogix/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elogix/frontend

jobs:

  # =========================
  # BACKEND BUILD
  # =========================
  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # =========================
  # FRONTEND BUILD
  # =========================
  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # =========================
  # DEPLOY
  # =========================
  deploy:
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    if: github.event_name != 'pull_request'

    steps:

      # Check that the SSH private key secret exists
      - name: Check SSH secret
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty"
            exit 1
          fi

          echo "SSH_PRIVATE_KEY is present"
          echo "$SSH_KEY" | head -n 1
          echo "$SSH_KEY" | tail -n 1

      # Deploy to server
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          debug: true

          script: |
            set -e

            echo "================================"
            echo "Connected to deployment server"
            echo "================================"

            echo "User:"
            whoami

            echo "Hostname:"
            hostname

            echo "Docker version:"
            docker --version

            cd "${{ secrets.REMOTE_PATH }}"

            echo "--- Pulling latest images ---"
            docker compose pull

            echo "--- Restarting containers ---"
            docker compose up -d --remove-orphans

            echo "--- Container status ---"
            docker compose ps

            echo "--- Frontend health ---"
            sleep 10

            if curl -sf http://localhost:80 > /dev/null; then
              echo "Frontend responding"
            else
              echo "Frontend not responding"
              docker compose logs --tail 30 frontend
              exit 1
            fi

            echo "--- Backend health ---"
            sleep 5

            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Backend responding"
            else
              echo "Backend not responding"
              docker compose logs --tail 50 backend
              exit 1
            fi

            echo "================================"
            echo "Deploy complete"
            echo "================================"
