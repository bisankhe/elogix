# FILE: .github/workflows/deploy.yml
# eLogix HRMS — CI/CD Pipeline
# eLogix Technologies · www.elogix.com.np
#
# SECRETS REQUIRED in GitHub → Settings → Secrets and variables → Actions:
#   SSH_PRIVATE_KEY  →  private key file contents (-----BEGIN ... -----END)
#   SSH_HOST         →  server hostname or IP  (e.g. elogix.com.np)
#   SSH_USERNAME     →  SSH login user          (e.g. root)
#   (port is hardcoded to 22 — no secret needed)
#   (deploy path is hardcoded to /opt/elogix — no secret needed)

name: eLogix CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY:       ghcr.io
  BACKEND_IMAGE:  ghcr.io/${{ github.repository_owner }}/elogix/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elogix/frontend

jobs:

  # ============================================================
  # BUILD AND PUSH BACKEND
  # ============================================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          # Context = project root so alembic.ini + alembic/ + backend/ are all present
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # BUILD AND PUSH FRONTEND
  # ============================================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          # FIX 1: was "Dockerfile" (does not exist at root)
          # Dockerfile.frontend was created — runs npm build then serves via nginx
          file: Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          # No cache for frontend — ensures fresh npm install every time
          # Remove these two lines once build is stable and you want speed
          # cache-from: type=gha
          # cache-to:   type=gha,mode=max

  # deploy job removed — Yeti Cloud auto-deploys via Git/SVN
  # git push origin main → Yeti detects commit → deploys in ~2 min
