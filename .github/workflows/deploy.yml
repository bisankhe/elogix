name: Deploy eLogix HRMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ══════════════════════════════════════════════════════════════
  # 1. TEST BACKEND
  # ══════════════════════════════════════════════════════════════
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: elogix_test
          POSTGRES_USER: elogix
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-flask faker anyio

      - name: Run backend tests
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://elogix:testpass@localhost:5432/elogix_test
          FLASK_ENV: testing
          PYTHONPATH: .
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret

  # ══════════════════════════════════════════════════════════════
  # 2. BUILD BACKEND DOCKER IMAGE
  # ══════════════════════════════════════════════════════════════
  build-images:
    needs: [test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

