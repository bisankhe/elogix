      # ── Verify secrets are set before attempting deploy ─────
      - name: Check deployment secrets
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "❌ ERROR: VM_HOST secret is not set"
            echo "Go to: github.com/bisankhe/elogix → Settings → Secrets → New repository secret"
