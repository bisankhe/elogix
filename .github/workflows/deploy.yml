# FILE: .github/workflows/deploy.yml
# eLogix HRMS — CI/CD Pipeline
# eLogix Technologies · www.elogix.com.np

name: eLogix CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY:       ghcr.io
  BACKEND_IMAGE:  ghcr.io/${{ github.repository_owner }}/elogix/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elogix/frontend

jobs:

  # ============================================================
  # BUILD AND PUSH BACKEND
  # ============================================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # BUILD AND PUSH FRONTEND
  # ============================================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # DEPLOY TO SERVER
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ----------------------------------------------------------
      # Verify SSH secret exists before attempting connection
      # ----------------------------------------------------------
      - name: Check SSH private key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY secret is empty or missing"
            echo "   Go to: github.com/bisankhe/elogix → Settings → Secrets and variables → Actions"
            echo "   Add secret named: SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "✅ SSH_PRIVATE_KEY is present"
          echo "Key starts with: $(echo "$SSH_KEY" | head -n 1)"
          echo "Key ends with:   $(echo "$SSH_KEY" | tail -n 1)"


      # ----------------------------------------------------------
      # Deploy using SSH
      # ----------------------------------------------------------
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m

          script: |
            set -e

            echo "=========================================="
            echo "Connected to deployment server"
            echo "=========================================="

            whoami
            hostname
            docker --version
            docker compose version

            echo "=========================================="
            echo "Changing to deployment directory"
            echo "=========================================="

            cd /opt/elogix
            pwd

            echo "=========================================="
            echo "Pulling latest Docker images"
            echo "=========================================="

            docker compose pull

            echo "=========================================="
            echo "Starting containers"
            echo "=========================================="

            docker compose up -d --remove-orphans

            echo "=========================================="
            echo "Container status"
            echo "=========================================="

            docker compose ps

            echo "=========================================="
            echo "Waiting for services to start"
            echo "=========================================="

            sleep 15

            echo "--- Frontend health check ---"
            if curl -sf http://localhost:80 > /dev/null; then
              echo "✅ Frontend responding on port 80"
            else
              echo "❌ ERROR: Frontend not responding"
              docker compose logs --tail 30 elogix_frontend
              exit 1
            fi

            echo "--- Backend health check ---"
            if curl -sf http://localhost:5000/health > /dev/null || curl -sf http://localhost/api/health > /dev/null || curl -sf http://localhost:5000/ > /dev/null; then
              echo "✅ Backend responding successfully"
            else
              echo "❌ ERROR: Backend not responding"
              docker compose logs --tail 50 elogix_backend
              exit 1
            fi

            echo "=========================================="
            echo "✅ Deployment completed successfully"
            echo "=========================================="
