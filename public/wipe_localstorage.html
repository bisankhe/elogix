<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>eLogix — Clear Stale Data</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; margin: 0; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 16px;
         padding: 36px 40px; max-width: 480px; width: 90%; text-align: center; }
  h2   { color: #f8fafc; margin: 0 0 8px; font-size: 20px; }
  p    { color: #94a3b8; font-size: 13px; margin: 0 0 28px; line-height: 1.6; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 10px;
         border: none; font-size: 14px; font-weight: 800; cursor: pointer;
         font-family: inherit; margin-bottom: 12px; }
  .red  { background: #dc2626; color: #fff; }
  .blue { background: #0369a1; color: #fff; }
  .gray { background: #334155; color: #94a3b8; }
  .log  { background: #0f172a; border: 1px solid #334155; border-radius: 8px;
          padding: 12px; margin-top: 20px; text-align: left; font-size: 11px;
          color: #4ade80; font-family: monospace; max-height: 200px;
          overflow-y: auto; display: none; }
  .done { color: #4ade80; font-size: 28px; display: none; }
</style>
</head>
<body>
<div class="box">
  <div style="font-size:40px;margin-bottom:12px">🗑️</div>
  <h2>Wipe eLogix Stale Data</h2>
  <p>This will remove all eLogix-related data<br>
     from your browser's localStorage and sessionStorage.</p>

  <button class="btn red" onclick="nukeAll()">
    💣 WIPE ALL — Remove Everything Now
  </button>
  <button class="btn blue" onclick="nukeElogix()">
    🎯 Remove Only eLogix Keys
  </button>
  <button class="btn gray" onclick="showKeys()">
    🔍 Inspect Current localStorage
  </button>

  <div class="done" id="done">✅ Done! Redirecting...</div>
  <div class="log" id="log"></div>
</div>

<script>
// Dynamically detect all elogix_ prefixed keys — no hardcoded list
function getElogixKeys() {
  const keys = []
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i)
    if (k && k.toLowerCase().startsWith('elogix_')) keys.push(k)
  }
  return keys
}

function getElogixSessionKeys() {
  const keys = []
  for (let i = 0; i < sessionStorage.length; i++) {
    const k = sessionStorage.key(i)
    if (k && k.toLowerCase().startsWith('elogix_')) keys.push(k)
  }
  return keys
}

function log(msg, color) {
  const el = document.getElementById('log')
  el.style.display = 'block'
  el.innerHTML += `<div style="color:${color||'#4ade80'}">${msg}</div>`
  el.scrollTop = el.scrollHeight
}

function nukeAll() {
  const count = localStorage.length
  const keys  = []
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i))
  keys.forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k) })
  log(`💣 Wiped ALL ${count} localStorage keys`, '#f87171')
  log('💣 Wiped sessionStorage too', '#f87171')
  showDone()
}

function nukeElogix() {
  let wiped = 0

  // Remove all elogix_ prefixed localStorage keys
  const lsKeys = getElogixKeys()
  lsKeys.forEach(k => {
    localStorage.removeItem(k)
    log(`🗑 localStorage["${k}"] removed`)
    wiped++
  })

  // Remove all elogix_ prefixed sessionStorage keys
  const ssKeys = getElogixSessionKeys()
  ssKeys.forEach(k => {
    sessionStorage.removeItem(k)
    log(`🗑 sessionStorage["${k}"] removed`)
    wiped++
  })

  if (wiped === 0) {
    log('✅ No eLogix data found — storage is already clean!', '#4ade80')
  } else {
    log(`✅ Removed ${wiped} eLogix keys total`, '#4ade80')
  }
  showDone()
}

function showKeys() {
  const el = document.getElementById('log')
  el.style.display = 'block'
  el.innerHTML = ''
  if (localStorage.length === 0) {
    log('📭 localStorage is empty', '#94a3b8')
    return
  }
  log(`📦 ${localStorage.length} keys in localStorage:`, '#94a3b8')
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i)
    const v = localStorage.getItem(k) || ''
    const preview    = v.length > 80 ? v.slice(0, 80) + '…' : v
    const isElogix   = k.toLowerCase().startsWith('elogix_')
    log(`${isElogix ? '🔵' : '⚪'} ${k}: ${preview}`, isElogix ? '#7dd3fc' : '#94a3b8')
  }
}

function showDone() {
  document.getElementById('done').style.display = 'block'
  setTimeout(() => {
    window.location.href = window.location.origin
  }, 2000)
}
</script>
</body>
</html>
