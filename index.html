<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="eLogix HRMS - AI-powered HRIS, HRMS, HRIM and HCM platform built for Nepal Labour Act 2074 compliance." />
    <title>eLogix - AI-Powered HR Software</title>

    <!-- Preload the logo so it's in cache before CSS references it -->
    <link rel="preload" href="/src/assets/Logo.png" as="image" />

    <style>
      /* ============================================================
         NepHR Pro Splash Screen
         - Pure CSS/HTML — renders before ANY JS downloads
         - Logo from /src/assets/Logo.png (preloaded above)
         - Guaranteed minimum 3.5s on screen (see main.jsx)
         - Auto-dismissed by main.jsx after React mounts + min time
         ============================================================ */

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #0f172a;
        overflow: hidden;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        /* Subtle animated background glow */
        overflow: hidden;
      }

      /* Background ambient glow blobs */
      #app-splash::before {
        content: '';
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
        top: -150px;
        right: -150px;
        animation: glow-drift 6s ease-in-out infinite alternate;
      }
      #app-splash::after {
        content: '';
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139,92,246,0.10) 0%, transparent 70%);
        bottom: -120px;
        left: -100px;
        animation: glow-drift 7s ease-in-out infinite alternate-reverse;
      }

      /* ── Logo card ─────────────────────────────────────────── */
      .splash-logo-wrap {
        position: relative;
        z-index: 1;
        width: 110px;
        height: 110px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
        border: 1.5px solid rgba(255,255,255,0.10);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 0 1px rgba(59,130,246,0.15),
          0 20px 60px rgba(0,0,0,0.5),
          0 0 80px rgba(59,130,246,0.18);
        animation: logo-appear 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
        margin-bottom: 28px;
      }

      .splash-logo-wrap img {
        width: 80px;
        height: 80px;
        object-fit: contain;
        /* In case logo hasn't loaded yet, show a fallback */
        display: block;
      }

      /* Fallback when logo fails — show initials */
      .splash-logo-wrap img::after {
        content: 'N';
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        font-size: 42px;
        font-weight: 900;
        color: #3b82f6;
      }

      /* Thin spinning ring around logo */
      .splash-ring {
        position: absolute;
        inset: -8px;
        border-radius: 36px;
        border: 2px solid transparent;
        border-top-color: rgba(59,130,246,0.7);
        border-right-color: rgba(139,92,246,0.4);
        animation: ring-spin 2s linear infinite;
      }

      /* ── Text block ────────────────────────────────────────── */
      .splash-text {
        position: relative;
        z-index: 1;
        text-align: center;
        margin-bottom: 36px;
        animation: text-rise 0.6s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
      }

      .splash-title {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #f8fafc;
        line-height: 1;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #f8fafc 0%, #c7d2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .splash-tagline {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: #64748b;
        text-transform: uppercase;
      }

      .splash-tagline span {
        color: #475569;
      }

      /* ── Progress bar ──────────────────────────────────────── */
      .splash-progress-wrap {
        position: relative;
        z-index: 1;
        width: 220px;
        animation: text-rise 0.6s 0.35s both;
      }

      .splash-progress-track {
        width: 100%;
        height: 3px;
        background: rgba(255,255,255,0.07);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      /* CSS-only animated progress that looks natural (not a fake spinner) */
      .splash-progress-bar {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
        background-size: 200% 100%;
        animation:
          progress-fill 3.2s cubic-bezier(0.4,0,0.2,1) forwards,
          shimmer 1.4s linear infinite;
        width: 0%;
      }

      .splash-status {
        font-size: 10px;
        color: #475569;
        text-align: center;
        letter-spacing: 0.04em;
        min-height: 14px;
        animation: status-cycle 3.2s steps(1) forwards;
      }

      /* ── Feature pills ─────────────────────────────────────── */
      .splash-pills {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 340px;
        margin-top: 28px;
        animation: text-rise 0.6s 0.5s both;
      }

      .splash-pill {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #64748b;
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.07);
        background: rgba(255,255,255,0.03);
      }

      /* ── Nepal flag accent strip ───────────────────────────── */
      .splash-nepal {
        position: absolute;
        bottom: 28px;
        font-size: 10px;
        color: #374151;
        letter-spacing: 0.05em;
        z-index: 1;
      }
      .splash-nepal span { color: #4b5563; }

      /* ── Hide state (triggered by main.jsx) ────────────────── */
      #app-splash.splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Keyframes ─────────────────────────────────────────── */
      @keyframes logo-appear {
        from { transform: scale(0.6) translateY(10px); opacity: 0; }
        to   { transform: scale(1) translateY(0); opacity: 1; }
      }
      @keyframes text-rise {
        from { transform: translateY(12px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
      }
      @keyframes ring-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes glow-drift {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(30px, 20px) scale(1.1); }
      }
      @keyframes progress-fill {
        0%    { width: 0%; }
        15%   { width: 18%; }   /* Loading JS...    */
        40%   { width: 45%; }   /* Initializing...  */
        65%   { width: 70%; }   /* Loading modules  */
        85%   { width: 88%; }   /* Almost ready     */
        100%  { width: 100%; }  /* Ready!           */
      }
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes status-cycle {
        0%   { content: none; }  /* handled by JS fallback below */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-splash" aria-hidden="true" aria-label="Loading eLogix HRMS">
      <div class="splash-logo-wrap">
        <div class="splash-ring"></div>
        <img
          src="/src/assets/Logo.png"
          alt="eLogix"
          onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend', '<div style=\'font-size:44px;font-weight:900;color:#3b82f6;font-family:system-ui\'>N</div>')"
        />
      </div>

      <div class="splash-text">
        <div class="splash-title">eLogix</div>
        <div class="splash-tagline">
          HRIS&nbsp;<span>·</span>&nbsp;HRMS&nbsp;<span>·</span>&nbsp;HRIM&nbsp;<span>·</span>&nbsp;HCM
        </div>
      </div>

      <div class="splash-progress-wrap">
        <div class="splash-progress-track">
          <div class="splash-progress-bar" id="splash-bar"></div>
        </div>
        <div class="splash-status" id="splash-status">Initializing modules...</div>
      </div>

      <div class="splash-pills">
        <span class="splash-pill">🤖 AI-Powered</span>
        <span class="splash-pill">⚖️ Nepal Labour Act 2074</span>
        <span class="splash-pill">🔒 Role-Based Access</span>
        <span class="splash-pill">📊 130+ HR Modules</span>
      </div>

      <div class="splash-nepal">
        <span>Designed for Nepal 🇳🇵 · Built with ❤️</span>
      </div>
    </div>

    <!-- Cycling status text (pure JS, non-blocking, runs after paint) -->
    <script>
      (function() {
        var msgs = [
          'Initializing eLogix...',
          'Loading HR engine...',
          'Configuring Nepal Labour Act 2074...',
          'Preparing 130+ modules...',
          'Almost ready...',
        ];
        var el = document.getElementById('splash-status');
        var i = 0;
        var iv = setInterval(function() {
          i++;
          if (i < msgs.length && el) el.textContent = msgs[i];
          if (i >= msgs.length - 1) clearInterval(iv);
        }, 680);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
