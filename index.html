<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="eLogix HRMS - AI-Powered HRMS · HRIS · HRIM · HCM platform built for Nepal Labour Act 2074 compliance." />
    <title>eLogix - AI-Powered HR Software</title>
    <link rel="preload" href="/src/assets/Logo.png" as="image" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body { background: #0f172a; overflow: hidden; }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        /* Fast dismiss transition — 0.3s instead of 0.5s */
        transition: opacity 0.3s ease, visibility 0.3s ease;
        overflow: hidden;
      }

      /* Ambient glow — lighter, faster */
      #app-splash::before {
        content: '';
        position: absolute;
        width: 500px; height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59,130,246,0.10) 0%, transparent 70%);
        top: -120px; right: -120px;
      }
      #app-splash::after {
        content: '';
        position: absolute;
        width: 400px; height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139,92,246,0.08) 0%, transparent 70%);
        bottom: -100px; left: -80px;
      }

      /* ── Logo ── */
      .splash-logo-wrap {
        position: relative;
        z-index: 1;
        width: 96px; height: 96px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
        border: 1.5px solid rgba(255,255,255,0.10);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 60px rgba(59,130,246,0.15);
        /* Fast appear — 0.4s */
        animation: logo-appear 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
        margin-bottom: 22px;
      }

      .splash-logo-wrap img {
        width: 72px; height: 72px;
        object-fit: contain;
      }

      /* Spinning ring */
      .splash-ring {
        position: absolute;
        inset: -7px;
        border-radius: 31px;
        border: 2px solid transparent;
        border-top-color: rgba(59,130,246,0.7);
        border-right-color: rgba(139,92,246,0.4);
        /* Fast spin — 1s */
        animation: ring-spin 1s linear infinite;
      }

      /* ── Text ── */
      .splash-text {
        position: relative;
        z-index: 1;
        text-align: center;
        margin-bottom: 28px;
        animation: text-rise 0.35s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
      }

      .splash-title {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #f8fafc 0%, #c7d2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 6px;
      }

      .splash-tagline {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: #475569;
        text-transform: uppercase;
      }
      .splash-tagline span { color: #334155; }

      /* ── Progress bar — FAST: 1.5s ── */
      .splash-progress-wrap {
        position: relative;
        z-index: 1;
        width: 200px;
        animation: text-rise 0.35s 0.2s both;
      }

      .splash-progress-track {
        width: 100%;
        height: 3px;
        background: rgba(255,255,255,0.07);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      /* Progress completes in 1.5s — user waits max 2s then React kicks in */
      .splash-progress-bar {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
        background-size: 200% 100%;
        animation:
          progress-fill 1.5s cubic-bezier(0.4,0,0.6,1) forwards,
          shimmer 0.8s linear infinite;
        width: 0%;
      }

      .splash-status {
        font-size: 10px;
        color: #475569;
        text-align: center;
        letter-spacing: 0.04em;
        min-height: 14px;
      }

      /* ── Pills ── */
      .splash-pills {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 320px;
        margin-top: 22px;
        animation: text-rise 0.35s 0.3s both;
      }

      .splash-pill {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #64748b;
        padding: 3px 9px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.07);
        background: rgba(255,255,255,0.03);
      }

      /* ── Footer ── */
      .splash-nepal {
        position: absolute;
        bottom: 22px;
        font-size: 10px;
        color: #374151;
        letter-spacing: 0.04em;
        z-index: 1;
      }
      .splash-nepal span { color: #4b5563; }

      /* ── Hide ── */
      #app-splash.splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Keyframes ── */
      @keyframes logo-appear {
        from { transform: scale(0.7) translateY(8px); opacity: 0; }
        to   { transform: scale(1) translateY(0); opacity: 1; }
      }
      @keyframes text-rise {
        from { transform: translateY(10px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
      }
      @keyframes ring-spin {
        to { transform: rotate(360deg); }
      }
      /* Progress: 0→60% fast, then 60→90% slow (waits for React), then React dismisses */
      @keyframes progress-fill {
        0%   { width: 0%; }
        30%  { width: 55%; }
        70%  { width: 80%; }
        100% { width: 92%; }
      }
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-splash" aria-hidden="true" aria-label="Loading eLogix HRMS">
      <div class="splash-logo-wrap">
        <div class="splash-ring"></div>
        <img
          src="/src/assets/Logo.png"
          alt="eLogix"
          onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<div style=\\'font-size:40px;font-weight:900;color:#3b82f6;font-family:system-ui\\'>e</div>')"
        />
      </div>

      <div class="splash-text">
        <div class="splash-title">eLogix</div>
        <div class="splash-tagline">
          AI-Powered HRMS&nbsp;<span>·</span>&nbsp;HRIS&nbsp;<span>·</span>&nbsp;HRIM&nbsp;<span>·</span>&nbsp;HCM
        </div>
      </div>

      <div class="splash-progress-wrap">
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
        <div class="splash-status" id="splash-status">Loading eLogix...</div>
      </div>

      <div class="splash-pills">
        <span class="splash-pill">🤖 AI-Powered</span>
        <span class="splash-pill">⚖️ Nepal Labour Act 2074</span>
        <span class="splash-pill">🔒 Role-Based Access</span>
        <span class="splash-pill">📊 130+ HR Modules</span>
      </div>

      <div class="splash-nepal">
        <span>Designed for Nepal 🇳🇵 · Built with ❤️</span>
      </div>
    </div>

    <!-- Fast status messages — 3 messages × 400ms = 1.2s total -->
    <script>
      (function() {
        var msgs = ['Loading eLogix...', 'Preparing modules...', 'Almost ready...'];
        var el = document.getElementById('splash-status');
        var i = 0;
        var iv = setInterval(function() {
          i++;
          if (el && i < msgs.length) el.textContent = msgs[i];
          if (i >= msgs.length - 1) clearInterval(iv);
        }, 400);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
